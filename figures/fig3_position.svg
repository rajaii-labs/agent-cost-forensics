t-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">THE BUNDLE&#x27;S COST PER TURN, BY POSITION</text><text x="16.0" y="281.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">in the 5-minute tail (before the change)</text><rect x="242.7" y="272.0" width="125.3" height="12.0" fill="#B9BFCB" stroke="#B9BFCB" stroke-width="0.8"/><text x="374.0" y="281.6" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="start">$0.171</text><text x="16.0" y="301.0" font-size="8.8" fill="#15171D" font-weight="500" text-anchor="start">own 1-hour breakpoint after the history (as shipped)</text><rect x="242.7" y="292.0" width="200.0" height="12.0" fill="#C8216A" stroke="#C8216A" stroke-width="0.8"/><text x="448.7" y="301.6" font-size="9.2" fill="#C8216A" font-weight="600" text-anchor="start">$0.273</text><text x="16.0" y="321.0" font-size="8.8" fill="#4A5162" font-weight="400" text-anchor="start">read from cache, as projected</text><rect x="242.7" y="312.0" width="10.3" height="12.0" fill="#E6E2FB" stroke="#4B2BD4" stroke-width="0.8"/><text x="259.0" y="321.6" font-size="9.2" fill="#15171D" font-weight="500" text-anchor="start">$0.014</text><text x="16.0" y="346.0" font-size="8.8" fill="#15171D" font-weight="500" text-anchor="start">a warm turn, like for like: $0.566 before, $0.688 as shipped, +21.6%; reverted the same day</text></svg>