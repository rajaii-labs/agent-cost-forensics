<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 366" width="624" height="366" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 3. Why it could never have worked</title><desc id="d">Two consecutive turns as token strips. The moved bundle sits after the history, which grows by two rows every turn, so the cached prefix ending at the bundle differs on every turn and the bundle misses every time; the history&#x27;s own breakpoint still hits. Below: the bundle&#x27;s cost per turn before the change ($0.171), as shipped ($0.273) and as projected ($0.014).</desc><rect width="624" height="366" fill="#FFFFFF"/><text x="16.0" y="18.0" font-size="8.2" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.12em">TWO CONSECUTIVE TURNS, AS SHIPPED ON 2026-07-25</text><text x="16.0" y="33.0" font-size="9" fill="#4A5162" font-weight="400" text-anchor="start">drawn to scale by tokens, except the dashed and the small boxes</text><text x="16.0" y="87.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">turn N</text><text x="16.0" y="167.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">turn N+1</text><rect x="70.0" y="70.0" width="89.6" height="26.0" fill="#B9BFCB" stroke="#FFFFFF" stroke-width="0.8"/><rect x="159.6" y="70.0" width="24.4" height="26.0" fill="#D4D8E0" stroke="#FFFFFF" stroke-width="0.8"/><rect x="184.0" y="70.0" width="172.9" height="26.0" fill="#EDEFF3" stroke="#FFFFFF" stroke-width="0.8"/><rect x="356.9" y="70.0" width="105.1" height="26.0" fill="#E6E2FB" stroke="#D9622B" stroke-width="1.6"/><rect x="462.0" y="70.0" width="58.0" height="26.0" fill="#F4F2FD" stroke="#D7DAE1" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="520.0" y="70.0" width="20.0" height="26.0" fill="#D9622B" strok