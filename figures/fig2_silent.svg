="#C8216A" stroke-width="1"/><text x="122.0" y="312.0" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">newest-20 keeps 4 of 11</text><text x="122.0" y="322.5" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">behavior pins</text><text x="262.0" y="282.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">nothing would show why</text><text x="262.0" y="292.8" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">behavior changed</text><text x="392.0" y="282.0" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">about $8.63 per pin a</text><text x="392.0" y="292.8" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">month</text><text x="500.0" y="282.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">a budget by category keeps</text><text x="500.0" y="292.8" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">all 11: about $163 a month</text><line x1="16.0" y1="342.0" x2="616.0" y2="342.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/><circle cx="20.0" cy="354.8" r="4" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.5"/><text x="30.0" y="358.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">My governing</text><text x="30.0" y="370.4" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">document</text><line x1="122.0" y1="356.0" x2="240.0" y2="356.0" stroke="#D7DAE1" stroke-width="1"/><rect x="181.0" y="350.0" width="59.0" height="12" fill="#E6E2FB" stroke="#4B2BD4" stroke-width="0.8"/><circle cx="128.6" cy="356.0" r="3.6" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.5"/><text x="122.0" y="388.0" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">a reply ~151 rows back, outside</text><text x="122.0" y="398.5" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">the 80-row window</text><text x="262.0" y="358.0" font-size="8.4" fill="#4A5162" 