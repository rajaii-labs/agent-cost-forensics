<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 440" width="624" height="440" role="img" aria-labelledby="t d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" style="font-kerning:normal;font-variant-numeric:tabular-nums"><title id="t">Figure 2. Five failures that raised no error</title><desc id="d">Five lanes, one per defect: the state writer, the document guard, the notification, the pin rule and the governing document. For each: what broke, drawn as its shape; what every instrument reported, which was nothing; what the money showed; and the fix.</desc><rect width="624" height="440" fill="#FFFFFF"/><text x="122.0" y="12.0" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">WHAT BROKE</text><text x="262.0" y="12.0" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">WHAT EVERY</text><text x="262.0" y="22.5" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">INSTRUMENT SAID</text><text x="392.0" y="12.0" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">WHAT THE MONEY</text><text x="392.0" y="22.5" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">SHOWED</text><text x="500.0" y="12.0" font-size="8" fill="#15171D" font-weight="500" text-anchor="start" font-family="&#x27;IBM Plex Mono&#x27;, &#x27;SFMono-Regular&#x27;, Menlo, monospace" letter-spacing="0.1em">THE FIX</text><line x1="16.0" y1="30.0" x2="616.0" y2="30.0" stroke="