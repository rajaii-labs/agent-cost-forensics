font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">26 of 51 runs failed to parse; two</text><text x="122.0" y="94.5" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">subsystems froze</text><text x="262.0" y="54.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">nothing: a failed parse is a</text><text x="262.0" y="64.8" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">silent no-op</text><text x="392.0" y="54.0" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">every cut-off run billed</text><text x="392.0" y="64.8" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">its full 2,000 output</text><text x="392.0" y="75.5" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">tokens</text><text x="500.0" y="54.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">cap 2,000 → 6,000, about</text><text x="500.0" y="64.8" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">$10 a month more</text><line x1="16.0" y1="114.0" x2="616.0" y2="114.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/><circle cx="20.0" cy="126.8" r="4" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.5"/><text x="30.0" y="130.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">The document</text><text x="30.0" y="142.4" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">guard</text><line x1="122.0" y1="144.0" x2="240.0" y2="144.0" stroke="#D7DAE1" stroke-width="0.8"/><path d="M122.0,135.1 L136.0,135.1 L136.0,122.0 L220.0,122.0 L220.0,137.1 L240.0,137.1" fill="none" stroke="#C8216A" stroke-width="1.6" stroke-linejoin="round"/><text x="122.0" y="160.0" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">the prompt 88k → 218k, then</text><text x="122.0" y="170.5" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">203–211k for 20 turns</text><text x="262.0" y="130.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">nothing: no error, no failed</text><text x="262.0" y="140.8" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">test, no dashboard</text><text x="392.0" y="130.0" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">$0.70 a turn against</text><text x="392.0" y="140.8" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">$0.52</text><text x="500.0" y="130.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">re-attach on request,</text><text x="500.0" y="140.8" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">collapse per attachment:</text><text x="500.0" y="151.5" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">about $50 a month</text><line x1="16.0" y1="190.0" x2="616.0" y2="190.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/><circle cx="20.0" cy="202.8" r="4" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.5"/><text x="30.0" y="206.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">The notification</text><rect x="123.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="121.0" y1="210.0" x2="139.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><rect x="142.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="140.0" y1="210.0" x2="158.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><rect x="161.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="159.0" y1="210.0" x2="177.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><rect x="180.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="178.0" y1="210.0" x2="196.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><rect x="199.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="197.0" y1="210.0" x2="215.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><rect x="218.0" y="198.0" width="14" height="10" rx="2.4" fill="#FFFFFF" stroke="#4A5162" stroke-width="1"/><line x1="216.0" y1="210.0" x2="234.0" y2="196.0" stroke="#C8216A" stroke-width="1.5" stroke-linecap="round"/><text x="122.0" y="236.0" font-size="8.2" fill="#15171D" font-weight="400" text-anchor="start">6 of 6 named the wrong cause</text><text x="262.0" y="206.0" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">the instrument was the error:</text><text x="262.0" y="216.8" font-size="8.4" fill="#4A5162" font-weight="400" text-anchor="start">&quot;primary unavailable&quot;</text><text x="392.0" y="206.0" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">six failovers, each a</text><text x="392.0" y="216.8" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">discarded attempt plus</text><text x="392.0" y="227.5" font-size="8.4" fill="#D9622B" font-weight="500" text-anchor="start">a fallback call</text><text x="500.0" y="206.0" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">silenced for the state writer,</text><text x="500.0" y="216.8" font-size="8.4" fill="#15171D" font-weight="400" text-anchor="start">as for the worker</text><line x1="16.0" y1="266.0" x2="616.0" y2="266.0" stroke="#EEF0F3" stroke-width="1" stroke-linecap="round"/><circle cx="20.0" cy="278.8" r="4" fill="#FFFFFF" stroke="#C8216A" stroke-width="1.5"/><text x="30.0" y="282.0" font-size="9.6" fill="#15171D" font-weight="600" text-anchor="start">The pin rule</text><circle cx="125.0" cy="277.0" r="2.4" fill="#4B2BD4"/><circle cx="131.0" cy="277.0" r="2.4" fill="#4B2BD4"/><circle cx="137.0" cy="277.0" r="2.4" fill="#4B2BD4"/><circle cx="143.0" cy="277.0" r="2.4" fill="#4B2BD4"/><circle cx="149.0" cy="2